name: Feature request
description: Suggest a new feature or an improvement for the desktop pet
title: "[Idea] "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Feature description
      description: What would you like the pet to add or improve?
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Use case
      description: When would you use it? What problem does it solve?
      placeholder: |
        For example: I would like the pet to…
  - type: textarea
    id: extra
    attributes:
      label: Additional notes
      description: References, screenshots, design ideas, etc.

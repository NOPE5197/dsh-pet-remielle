name: Bug report
description: Report a problem with the desktop pet
title: "[Pet] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Pet version
      description: The version number shown in Settings panel → Pet Management → Feedback
      placeholder: e.g. 0.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - dsh plugin add (GitHub)
        - Local link install
        - Other
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open dsh web
        2. Click the pet…
        3. The problem appears
  - type: textarea
    id: extra
    attributes:
      label: Additional information
      description: Console errors, screenshots, etc.

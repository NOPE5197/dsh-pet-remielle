name: Tests

# Every test in this repo is node --test + node:assert, with no external test framework.
# The only dependency is @deepseek-ai/schemastery (used for the Config schema in src/index.js);
# @deepseek-ai/cordis is a peerDependency and the tests don't need it — they pass --omit=peer to skip it,
# so a whole dependency tree isn't pulled in just for a host SDK.

on:
  push:
    # '**': development on this fork is pushed straight to branches (see AGENTS.md), and
    # watching main only would mean daily pushes never trigger CI at all. The concurrency
    # group automatically cancels older runs of the same branch, so the matrix runner is not used twice.
    branches: ['**']
  pull_request:

concurrency:
  # Keep only the newest commit per branch; push and pull_request events share the branch name, so one commit doesn't run two matrices.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --omit=peer --no-package-lock --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      # The full behavioural suite runs only once; Windows/macOS run just the platform-specific tests, to avoid burning scarce runners on duplicates.
      - name: Full test suite
        run: npm test

      - name: Build artifact matches source
        run: git diff --exit-code lib/client.js

      - name: Build artifact line endings
        run: node -e "const b=require('fs').readFileSync('lib/client.js');if(b.includes(13)){console.error('lib/client.js 含 CR，产物必须是单一 LF');process.exit(1)}"

  platform:
    # No fail-fast: both platforms' results should be visible; this does not mean every architecture is covered.
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --omit=peer --no-package-lock --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      # The Electron/window/updater tests are platform-dependent; the full behavioural suite is covered by the unit job.
      - name: Platform tests
        run: npm run test:platform

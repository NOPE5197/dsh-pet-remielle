<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Every page resource is same-origin (relative fetch/SSE paths, favicon.svg) + dataURL
     images + inline script/style; declaring a CSP also silences Electron's "no CSP
     specified in development" warning. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'">
<title>Remielle desktop pet</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  /* The main process writes the real system scale into --rm2-ui-zoom; shadow lengths are
     divided by zoom so the glow of the transparent window does not inflate with DPI
     (the web client has no such zoom layer).
     The pink shadow uses a negative spread to pull the bright edge under the card: on a
     transparent HWND a plain box-shadow in translucent pink blooms all the way around
     and looks bigger and brighter than on the web (where it sits on an opaque base). */
  :root {
    --rm2-ui-zoom: 1;
    --rm2-glow:
      0 calc(1px / var(--rm2-ui-zoom)) calc(3px / var(--rm2-ui-zoom)) rgba(0, 0, 0, .45),
      0 calc(3px / var(--rm2-ui-zoom)) calc(8px / var(--rm2-ui-zoom)) calc(-3px / var(--rm2-ui-zoom)) rgba(140, 40, 80, .16);
    --rm2-glow-top:
      0 calc(2px / var(--rm2-ui-zoom)) calc(4px / var(--rm2-ui-zoom)) rgba(0, 0, 0, .48),
      0 calc(4px / var(--rm2-ui-zoom)) calc(10px / var(--rm2-ui-zoom)) calc(-3px / var(--rm2-ui-zoom)) rgba(140, 40, 80, .18);
  }
  /* Content positioning is the job of the .pet fixed anchor layer below (see its
     comment); body only fills the viewport and disables selection */
  body {
    width: 100vw; height: 100vh;
    user-select: none; -webkit-user-select: none;
    font-family: system-ui, sans-serif;
  }
  /* .pet fixed anchor layer: size pinned to the window baseline (400×520 = PET_CONTENT_W/H
     in pet-window.cjs), pinned to the viewport top-left via fixed. When the menu grows the
     window it prefers to grow right/down (origin unchanged), so this layer does not stretch
     with the viewport and the content stays at the same on-screen position. When flipping to
     the left at the right edge the main process decreases x and the renderer pushes this
     layer back with an inline left. Children are bottom-aligned vertically, horizontally
     centered. */
  .pet {
    position: fixed; left: 0; top: 0;
    width: 400px; height: 520px;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
  }
  .rm2-pet-bubbles {
    position: relative;
    margin-bottom: 16px;
    width: fit-content;
    max-width: 453px;
    display: none;
    flex-direction: column;
    align-items: center;
    pointer-events: none;
    cursor: default;
  }
  .rm2-pet-bubble {
    display: none;
    position: relative;
    margin-bottom: 13px;
    box-sizing: border-box;
    min-width: 200px;
    max-width: 453px;
    padding: 16px 27px 16px 40px;
    border-radius: 29px;
    background: #fff0f5;
    border: 1px solid rgba(240, 120, 160, .45);
    box-shadow: var(--rm2-glow);
    font-size: 16px;
    line-height: 1.45;
    text-align: left;
    white-space: nowrap;
    cursor: default;
  }
  .rm2-pet-bubbles .rm2-pet-bubble {
    margin: 0;
    width: fit-content;
    height: 91px;
    min-height: 91px;
    box-shadow: var(--rm2-glow);
    pointer-events: auto;
    cursor: pointer;
    overflow: hidden;
    transition: width .18s ease, opacity .18s ease;
  }
  .rm2-pet-bubble-title { font-weight: 600; color: #b03a60; min-width: 0; flex: none; white-space: nowrap; overflow: visible; text-overflow: clip; line-height: 1.35; }
  .rm2-pet-bubble-detail { color: #c2607f; margin-top: 3px; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  /* Hand-drawn hover tip overlay: the native title does not follow setZoomFactor, so the text
     is far too small on high-scale screens (e.g. 200%). Shares the shadow set with the menu,
     not the web client's 8/24. */
  .rm2-pet-tip {
    position: fixed; z-index: 999;
    box-sizing: border-box;
    max-width: min(420px, calc(100vw - 48px));
    padding: 8px 12px;
    border-radius: 10px;
    background: #fff0f5;
    border: 1px solid rgba(240, 120, 160, .45);
    box-shadow: var(--rm2-glow);
    font-family: system-ui, sans-serif;
    font-size: 13px; line-height: 1.5; color: #8a2f52;
    white-space: pre-wrap; word-break: break-all;
    display: none; pointer-events: none;
  }
  /* The single switch for dark adaptation = html[data-host-theme] (written by
     syncHostTheme() after reconciling the host report with the system preference).
     Deliberately not a prefers-color-scheme media query: when the attribute and the system
     media query both match, which one wins depends on source order, and "host light + system
     dark" is exactly the most common inconsistent combination (the user enabled system dark
     but DSH runs a light theme) — two rule sets fighting each other makes both clients'
     colors drift at random. */
  html[data-host-theme="dark"] .rm2-pet-tip { background: #48142a; border-color: rgba(255, 150, 185, .42); color: #ffd6e4; }
  .rm2-pet-bubble-header { display: flex; align-items: center; min-width: 0; min-height: 29px; }
  .rm2-pet-bubble.title-clipped .rm2-pet-bubble-title { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .rm2-pet-bubble-action { display: inline-flex; flex: none; order: 2; align-items: center; justify-content: center; width: 29px; height: 29px; margin-left: 11px; margin-right: 0; border-radius: 50%; background: #e8508a; color: #fff; font-size: 20px; font-weight: 700; line-height: 1; }
  .rm2-pet-bubble-action img { width: 20px; height: 20px; display: block; filter: brightness(0) saturate(100%) invert(1); }
  .rm2-pet-bubble-completion { display: none; flex: none; width: 16px; height: 16px; margin-right: 13px; border-radius: 50%; background: #35c979; box-shadow: 0 0 0 4px rgba(53,201,121,.18); }
  .rm2-pet-bubble.completed .rm2-pet-bubble-completion { display: inline-flex; }
  .rm2-pet-bubble.idle-placeholder { height: 61px; min-height: 61px; padding-top: 15px; padding-bottom: 15px; }
  .rm2-pet-bubble-stack-count { display: none; position: absolute; right: 16px; bottom: 0; height: 8px; align-items: center; color: #f0a8c0; font-size: 9px; font-weight: 700; line-height: 8px; }
  .rm2-pet-bubble.summary-backboard .rm2-pet-bubble-stack-count { display: flex; }
  .rm2-pet-bubbles .rm2-pet-bubble:not(.top) .rm2-pet-bubble-title,
  .rm2-pet-bubbles .rm2-pet-bubble:not(.top) .rm2-pet-bubble-detail,
  .rm2-pet-bubbles .rm2-pet-bubble:not(.top) .rm2-pet-bubble-action,
  .rm2-pet-bubbles .rm2-pet-bubble:not(.top) .rm2-pet-bubble-completion { visibility: hidden; }
  .rm2-pet-bubble.top { border-color: #b03a60; box-shadow: var(--rm2-glow-top); }
  .rm2-pet-bubble.attention { border-color: #e8508a; animation: rm2-pet-attention 1.6s ease-in-out infinite; }
  @keyframes rm2-pet-attention { 0%,100% { box-shadow: 0 0 0 0 rgba(232,80,138,.35); } 50% { box-shadow: 0 0 0 6px rgba(232,80,138,0); } }
  .rm2-bubble-dots { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; pointer-events: auto; z-index: 120; }
  .rm2-bubble-dot { width: 13px; height: 13px; border-radius: 50%; background: #e8508a; cursor: pointer; box-shadow: 0 0 0 3px rgba(255,255,255,.65); transition: transform .18s, background .18s; }
  .rm2-bubble-dot:hover { transform: scale(1.25); }
  .rm2-bubble-balance { box-sizing: border-box; height: 91px; min-height: 91px; max-width: 440px; }
  .rm2-bubble-balance .rm2-pet-bubble-title { line-height: 29px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  img { width: 180px; height: auto; display: block; }
  /* Approval-not-delivered toast: a singleton banner hovering above the bubble stack (its
     bottom is computed live from the stack by JS); pointer-events lets desktop clicks
     through, z-index stays below the right-click menu (#menu:999) */
  .rm2-pet-toast {
    /* Horizontally anchored at the center of the 400px baseline (same baseline as the .pet
       anchor layer): left:50% would drift to the new center of the viewport widened by the
       menu, moving the toast sideways while the pet stays put */
    position: fixed; left: 200px;
    display: none; align-items: center; gap: 8px;
    padding: 7px 16px 7px 9px;
    border-radius: 17px;
    background: #fff0f5;
    border: 1px solid rgba(240, 120, 160, .55);
    box-shadow: var(--rm2-glow);
    font-size: 12px; color: #c2607f;
    white-space: nowrap;
    pointer-events: none;
    z-index: 900;
    opacity: 0;
    transform: translate(-50%, 6px);
    transition: opacity .18s ease-out, transform .18s ease-out;
  }
  .rm2-pet-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .rm2-pet-toast.hide { opacity: 0; transform: translate(-50%, 4px); transition: opacity .22s, transform .22s; }
  .rm2-pet-toast-icon { flex: none; width: 20px; height: 20px; border-radius: 50%; background: #e8508a; color: #fff; font-size: 13px; font-weight: 700; line-height: 20px; text-align: center; }
  .rm2-pet-toast b { color: #b03a60; font-weight: 600; }
  /* Right-click menu — fill/border use the same colors as the web client; see the bubble
     comment above for the shadow. */
  /* Geometry matches the web client's .rm2-pet-menu in src/client.core.js item by item:
     fixed width 240px, row gap 6px, row padding 7px 9px, slider 92px, percent 36px.
     The slider column is squeezed to 92px to make room for the label column: "Character size"
     is ≈72px, which works out to a 64px label column for the tightest row; squeezing any
     further overflows, triggers the ellipsis and renders "Charac…".
     test/platform/desktop-window.test.js pins this with two assertions — "both clients'
     parameters are equal" and "the label column is wide enough for the longest slider
     label" — so changing one side requires changing the other. */
  .menu {
    display: none; position: fixed; z-index: 999;
    box-sizing: border-box; width: 240px;
    background: #fff0f5;
    border: 1px solid rgba(240, 120, 160, .45);
    border-radius: 10px;
    box-shadow: var(--rm2-glow);
    padding: 6px;
    font-family: system-ui, sans-serif;
    font-size: 13px; color: #8a2f52;
    user-select: none; -webkit-user-select: none;
  }
  .menu-item { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 7px 9px; border-radius: 7px; cursor: pointer; white-space: nowrap; }
  /* The label column eats the leftover space: the slider and percent get pushed to the row
     end, so the slider edges of the "Character size" and "Opacity" rows line up exactly (in
     the old version the labels had different lengths, so space-between misaligned them).
     Note that min-width:0 is **deliberately not** written here — the label of an
     interactive row never shrinks, so a too-narrow menu becomes a visible overflow instead
     of silently rendering "Charac…"; only the status row may be truncated. */
  .menu-item > span:first-child { flex: 1 1 auto; }
  .menu-item:hover { background: rgba(240, 120, 160, .14); }
  /* line-height:1 is required: the checkmark "✓" (U+2713) falls back to another font whose
     glyph box is 19px tall while the label is only 16px, so line-height:normal pushes the
     row box from 30px to 33px — the whole row jitters 3px when checking/unchecking.
     Flattening the tick's own line-height contribution is enough (kept in sync with the web
     client's .rm2-pet-menu-item .tick — change one side, change the other). */
  .menu-item .tick { color: #b03a60; font-weight: 600; line-height: 1; }
  .menu-item .mute { color: #c2607f; font-size: 12px; }
  .menu-status > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .menu-slider { flex: none; width: 92px; margin: 0 2px; accent-color: #e8508a; }
  .menu-pct { flex: none; min-width: 36px; text-align: right; font-size: 12px; }
  .menu-sep { height: 1px; background: rgba(240, 120, 160, .25); margin: 5px 6px; }
  .menu-status { opacity: .85; cursor: default; }
  /* Dark adaptation goes after the light base rules: equal specificity is won by source
     order, otherwise the light background would paint back over the dark shell, producing
     the unreadable light-background/light-text combination.
     The switch is html[data-host-theme] (see the syncHostTheme note at the top of this file):
     the web client uses body[data-ds-dark-theme], while the desktop window has no host page
     and can only consume the hostTheme reported by the web client (snapshot field), falling
     back to the system theme only when it is unavailable — so both clients match. */
  /* Solid background: a translucent shell would let the pink shadow bleed through and make
     the edges look brighter. Every color/declaration maps item by item onto the web client's
     (body[data-ds-dark-theme] .rm2-pet-bubble); the only deliberate difference kept here is
     the solid background (behind the desktop window is the real desktop, and a .96
     translucent fill would let the wallpaper show through). */
  html[data-host-theme="dark"] .rm2-pet-bubble { background: #48142a; border-color: rgba(255, 150, 185, .42); color: #ffd6e4; }
  html[data-host-theme="dark"] .rm2-pet-bubble-title { color: #ffd6e4; }
  html[data-host-theme="dark"] .rm2-pet-bubble-detail { color: #f0a8c0; }
  html[data-host-theme="dark"] .rm2-pet-bubble.top { border-color: #ffb3c9; }
  html[data-host-theme="dark"] .rm2-pet-bubble.attention { border-color: #ff6fa8; }
  html[data-host-theme="dark"] .rm2-pet-toast { background: #48142a; border-color: rgba(255, 150, 185, .5); color: #e8a8bf; }
  html[data-host-theme="dark"] .rm2-pet-toast b { color: #ffb3c9; }
  html[data-host-theme="dark"] .menu { background: #48142a; border-color: rgba(255, 150, 185, .42); color: #ffd6e4; }
  html[data-host-theme="dark"] .menu-item:hover { background: rgba(255, 150, 185, .16); }
  html[data-host-theme="dark"] .menu-item .tick { color: #ffb3c9; }
  html[data-host-theme="dark"] .menu-item .mute { color: #f0a8c0; }
  html[data-host-theme="dark"] .menu-sep { background: rgba(255, 150, 185, .25); }
</style>
</head>
<body>
  <script src="/plugins/dsh-pet-remielle/balance-widget.js"></script>
  <script src="/plugins/dsh-pet-remielle/session-order.js"></script>
  <script src="/plugins/dsh-pet-remielle/pet-tip.js"></script>
  <script src="/plugins/dsh-pet-remielle/gif-frame.js"></script>
  <script src="/plugins/dsh-pet-remielle/bubble-title.js"></script>
  <div class="menu" id="menu"></div>
  <div class="pet">
    <div class="rm2-pet-bubbles" id="bubbleStack" title=""></div>
    <div class="rm2-pet-bubble top" id="bubble" style="position:relative;" title="">
      <div class="rm2-pet-bubble-title" id="title"></div>
      <div class="rm2-pet-bubble-detail" id="detail"></div>
      <div class="rm2-bubble-dots" id="bubbleDots" title="">
        <div class="rm2-bubble-dot" id="bubbleDot" title=""></div>
      </div>
    </div>
    <img id="pet" alt="Remielle" draggable="false">
  </div>
<script>
  var bubbleEl = document.getElementById('bubble')
  var titleEl = document.getElementById('title')
  var detailEl = document.getElementById('detail')
  var imgEl = document.getElementById('pet')
  var petBox = document.querySelector('.pet')
  var bubbleStack = document.getElementById('bubbleStack')
  var bubbleDots = document.getElementById('bubbleDots')
  var bubbleDot = document.getElementById('bubbleDot')
  var currentBubblePage = 0
  var prevBubbleVisible = false
  var balanceRequested = false
  var SESSION_OPEN_ENDPOINT = '/plugins/dsh-pet-remielle/session/open'
  var COMPLETION_ACK_ENDPOINT = '/plugins/dsh-pet-remielle/completion/ack'
  // Fixed sessionId of the fake backboard on the card stack's second layer (does not map to a
// real session; it only carries the +N and the click-to-jump).
  var BUBBLE_BACKBOARD_ID = '__pet_backboard__'
  var BACKBOARD_TIP_DEBOUNCE_MS = 400
  var currentSessionId = undefined
  var bubbleEls = new Map()
  // Hand-drawn hover tip overlay: the native title is rendered by the OS and does not scale
  // with setZoomFactor, so its text is far too small on high-DPI screens (200%). The text is
  // stored on the card's dataset.rm2Tip and the overlay is shown on hover.
  // Positioning is clamped inside "window ∩ work area" with room left for the glow, so text
  // never leaves the screen at a screen edge and the shadow is not cut vertically by
  // overflow:hidden.
  var petTip = null
  var petTipAnchor = null
  var __tip = window.__rm2PetTip
  if (!__tip) throw new Error('__rm2PetTip is missing: pet-tip.js script failed to load')
  // Bubble session cards: title throttling, width measurement and status copy (approval /
  // plan review / completion) — the very same implementation as the web client,
  // src/bubble-title.cjs.
  var __bubbleTitle = window.__rm2BubbleTitle
  // This throws instead of degrading gracefully like __gifFrame below: the bubble card's title
  // throttling, width measurement and status copy all go through it, and missing it silently
  // renders wrong cards, which is far harder to debug than an outright error.
  // The only way to reach here is "the plugin files were updated but DSH has not restarted" —
  // the host has no bubble-title.js route in memory yet while pet-view.html is already new.
  if (!__bubbleTitle) throw new Error('__rm2BubbleTitle is missing: bubble-title.js failed to load — if you just updated the plugin, restart DSH')
  // Grab the current frame of an animated GIF (used by the paused freeze) — the very same
  // implementation as the web client, src/gif-frame.cjs.
  // No throw here: it only serves the "Pause animation" feature, and its absence must not stop
  // the whole desktop pet window from coming up — without freeze() it falls back to the first
  // frame snapshot. __gifFrame.watch starts the animation timer table.
  var __gifFrame = window.__rm2GifFrame
  if (__gifFrame && __gifFrame.watch) __gifFrame.watch(imgEl)
  function hidePetTip() {
    petTipAnchor = null
    if (petTip) petTip.style.display = 'none'
  }
  function layoutPetTip(anchor, L, T, R, B) {
    __tip.layoutPetTip(petTip, anchor, L, T, R, B)
  }
  // One-shot tip: swap the anchor's tip to the given copy, show it, and restore it ms
  // milliseconds later.
  // Used for the moments where an action was intentionally not performed — more explanatory
  // than doing nothing at all.
  var TRANSIENT_TIP_MS = 2600
  function showTransientTip(anchor, text, ms) {
    if (!anchor || !anchor.dataset) return
    var had = Object.prototype.hasOwnProperty.call(anchor.dataset, 'rm2Tip')
    var prev = anchor.dataset.rm2Tip
    anchor.dataset.rm2Tip = text
    showPetTip(anchor)
    window.setTimeout(function () {
      if (had) anchor.dataset.rm2Tip = prev
      else delete anchor.dataset.rm2Tip
      // After restoring, if the cursor still hovers the anchor, showPetTip takes over with
      // the original tooltip; if the cursor already left, the hidePetTip on the renderBubble
      // side has finished the job.
      if (petTipAnchor === anchor) showPetTip(anchor)
    }, ms || TRANSIENT_TIP_MS)
  }
  function showPetTip(anchor) {
    var text = anchor && anchor.dataset ? anchor.dataset.rm2Tip : ''
    if (!text) { hidePetTip(); return }
    if (!petTip) {
      petTip = document.createElement('div')
      petTip.className = 'rm2-pet-tip'
      document.body.appendChild(petTip)
    }
    petTip.textContent = text
    petTip.style.left = '-9999px'
    petTip.style.top = '0px'
    petTip.style.display = 'block'
    petTipAnchor = anchor
    var W = window.innerWidth || 400
    var H = window.innerHeight || 520
    layoutPetTip(anchor, 0, 0, W, H)
    if (window.petBridge && window.petBridge.getWorkArea) {
      window.petBridge.getWorkArea().then(function (wa) {
        if (petTipAnchor !== anchor || !petTip || petTip.style.display === 'none') return
        var L = Number(wa && wa.left)
        var T = Number(wa && wa.top)
        var R = Number(wa && wa.right)
        var B = Number(wa && wa.bottom)
        layoutPetTip(
          anchor,
          Number.isFinite(L) ? L : 0,
          Number.isFinite(T) ? T : 0,
          Number.isFinite(R) ? R : W,
          Number.isFinite(B) ? B : H,
        )
      }).catch(function () {})
    }
  }
  function syncDotTip() {
    __tip.applyDotTip(bubbleDot, currentBubblePage, petTipAnchor, showPetTip)
  }
  function onDotLeave(e) {
    __tip.onDotLeave(e, bubbleDot, bubbleDots, showPetTip, hidePetTip)
  }
  function commitBackboardTarget(target, tip) {
    var el = bubbleEls.get(BUBBLE_BACKBOARD_ID)
    if (el && el.node) {
      el.node.dataset.rm2Tip = tip
      if (petTipAnchor === el.node) showPetTip(el.node)
    }
  }
  var backboardStabilizer = __tip.createBackboardStabilizer(
    commitBackboardTarget,
    BACKBOARD_TIP_DEBOUNCE_MS,
    function (fn, ms) { return window.setTimeout(fn, ms) },
    function (timer) { window.clearTimeout(timer) },
  )
  var measureTextW = __bubbleTitle.measureTextW
  var bubbleRowWidth = __bubbleTitle.bubbleRowWidth
  function switchBubblePage(p) {
    currentBubblePage = p
    syncDotTip()
    if (p === 0) {
      balanceFrame = null
      if (lastSnapshot) apply(lastSnapshot)
      if (window.__petBalance && window.__petBalance.showStatus) window.__petBalance.showStatus()
    } else if (p === 1 && window.__petBalance && window.__petBalance.showBalance) {
      window.__petBalance.showBalance()
    }
  }
  function onBubbleWheel(e) {
    e.preventDefault(); e.stopPropagation()
    if (lastSnapshot) {
      var so = lastSnapshot.showBubble !== false && lastSnapshot.showBubbleStatus !== false
      var uo = lastSnapshot.showBubble !== false && lastSnapshot.showBubbleUsage === true
      if (!(so && uo)) return
    }
    switchBubblePage(currentBubblePage === 0 ? 1 : 0)
  }
  bubbleDot.addEventListener('click', function (e) { e.stopPropagation(); switchBubblePage(currentBubblePage === 0 ? 1 : 0) })
  bubbleDot.addEventListener('mouseenter', function (e) { if (e && e.stopPropagation) e.stopPropagation(); showPetTip(bubbleDot) })
  bubbleDot.addEventListener('mouseleave', onDotLeave)
  syncDotTip()
  bubbleEl.addEventListener('wheel', onBubbleWheel, { passive: false })
  bubbleStack.addEventListener('wheel', onBubbleWheel, { passive: false })
  // The bubble area swallows desktop pet interaction events: double-clicking the bubble no
  // longer triggers drawing (window dblclick), and pressing/clicking the bubble no longer
  // bubbles up either; the bubble's own dots and session card actions stay unaffected.
  var petSwallowTypes = ['pointerdown', 'mousedown', 'click', 'dblclick']
  ;[bubbleEl, bubbleStack].forEach(function (el) {
    for (var i = 0; i < petSwallowTypes.length; i++) {
      el.addEventListener(petSwallowTypes[i], function (e) { e.stopPropagation() })
    }
  })
  // The right-click menu area swallows interaction events too: clicking menu rows repeatedly no
  // longer accidentally triggers drawing, and the wheel over the menu no longer zooms
  var menuEl = document.getElementById('menu')
  var menuSwallowTypes = ['pointerdown', 'mousedown', 'click', 'dblclick', 'wheel']
  for (var mi = 0; mi < menuSwallowTypes.length; mi++) {
    menuEl.addEventListener(menuSwallowTypes[mi], function (e) { e.stopPropagation() })
  }
  var picEl = document.createElement('img')

    var dispW = 240
    var dispH = Math.max(60, Math.min(420, Math.round(240 * H / W)))
    var cv = document.createElement('canvas')
    drawCv = cv
    cv.width = dispW; cv.height = dispH
    var g = cv.getContext('2d')
    g.clearRect(0, 0, dispW, dispH)
    var D = dispW + dispH
    var r = Math.max(dispW, dispH) * 0.15
    var T = 6000
    var t0 = null
    var shown = false
    var lastPush = -1

    function openTarget() {
      if (useElectron) {
        window.petBridge.artworkOpen(dispW, dispH)
      } else {
        cv.style.cssText = 'position:fixed;right:24px;top:24px;width:' + dispW + 'px;height:auto;border-radius:10px;display:block;cursor:pointer;z-index:9999;'
        cv.title = 'Click to close'
        cv.addEventListener('click', function () { if (cv.parentNode) document.body.removeChild(cv) })
        document.body.appendChild(cv)
      }
      shown = true
    }
    function pushFrame(now) {
      if (!shown) openTarget()
      if (!useElectron) return // the in-window canvas is the live display by itself
      if (now - lastPush < 33) return // ~30fps, avoid flooding IPC
      lastPush = now
      window.petBridge.artworkSet(cv.toDataURL('image/png'))
    }
    function lineAt(dd) {
      var ax = Math.max(0, dd - dispH), ay = dd - ax
      var by = Math.max(0, dd - dispW), bx = dd - by
      return { ax: ax, ay: ay, bx: bx, by: by }
    }
    function frame(ts) {
      if (seq !== drawSeq) return // belt and braces: a stale animation loop just exits
      if (t0 === null) t0 = ts
      var p = Math.min(1, (ts - t0) / T)
      if (p >= 1) {
        g.globalAlpha = 1
        g.globalCompositeOperation = 'source-over'
        g.drawImage(img, 0, 0, W, H, 0, 0, dispW, dispH)
        pushFrame(ts)
        // Drawing done: switch to "Pleased (03)", hold for a moment, then fade out over 0.8s and
        // close (both timers can be cancelled by the next round)
        moodOverride = { mood: '03', until: Date.now() + 2200 }
        apply(lastSnapshot)
        drawAfterTimer = window.setTimeout(function () {
          if (useElectron) window.petBridge.artworkFade()
          else if (cv.parentNode) {
            cv.style.transition = 'opacity 0.8s ease-out'
            cv.style.opacity = '0'
          }
          drawHideTimer = window.setTimeout(function () {
            if (useElectron) window.petBridge.artworkClose()
            else if (cv.parentNode) document.body.removeChild(cv)
          }, 800)
        }, 2200)
        return
      }
      var d = D * p
      var L = lineAt(d)
      var half = 440
      var ph = (ts - t0) % (half * 2)
      var s = ph < half ? ph / half : 1 - (ph - half) / half
      for (var k = 0; k < 2; k++) {
        var sk = Math.min(1, Math.max(0, s + k * 0.04))
        var cx = L.bx + (L.ax - L.bx) * sk
        var cy = L.by + (L.ay - L.by) * sk
        // A little randomness on the brush path
        cx += (Math.random() - 0.5) * r * 0.6
        cy += (Math.random() - 0.5) * r * 0.6
        var rr = r * (0.85 + 0.3 * Math.random())
        g.save()
        g.beginPath()
        g.arc(cx, cy, rr, 0, Math.PI * 2)
        g.clip()
        g.globalAlpha = 1
        g.globalCompositeOperation = 'source-over'
        g.drawImage(img, 0, 0, W, H, 0, 0, dispW, dispH)
        g.restore()
      }
      pushFrame(ts)
      drawRafId = window.requestAnimationFrame(frame)
    }
    drawRafId = window.requestAnimationFrame(frame)
  }
  window.addEventListener('dblclick', playDraw)

  // Mouse wheel: resize the pet (persisted through host config).
  window.addEventListener('wheel', function (e) {
    e.preventDefault()
    if (!lastSnapshot) return
    var delta = e.deltaY < 0 ? 0.05 : -0.05
    var next = Math.min(2, Math.max(0.5, (lastSnapshot.scale || 1) + delta))
    next = Math.round(next * 20) / 20
    fetch('/plugins/dsh-pet-remielle/config', {
      method: 'PATCH',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ scale: next }),
    }).catch(function () {})
  }, { passive: false })

  // Remember the window position across restarts.
  // Restore priority: host persistence (config.desktopX/desktopY, the main process positions
  // the window at creation) > localStorage fallback (only useful when the host persistence is
  // missing; its save lives in userData and may be stale).
  // Never moveTo again once the main process has positioned the window by the persisted
  // coordinates, otherwise the stale save fights the host coordinates.
  var initialPosKnown = window.petBridge && window.petBridge.getInitialPosition
    ? window.petBridge.getInitialPosition().catch(function () { return null })
    : Promise.resolve(null)
  initialPosKnown.then(function (pos) {
    if (pos && typeof pos.x === 'number' && typeof pos.y === 'number') return
    try {
      var saved = JSON.parse(localStorage.getItem('dsh-pet-window-pos') || 'null')
      if (saved && typeof saved.x === 'number' && typeof saved.y === 'number') {
        window.moveTo(saved.x, saved.y)
      }
    } catch (e) { /* storage unavailable */ }
  })
  setInterval(function () {
    try {
      localStorage.setItem('dsh-pet-window-pos', JSON.stringify({ x: window.screenX, y: window.screenY }))
    } catch (e) { /* storage unavailable */ }
  }, 2000)
</script>
</body>
</html>
